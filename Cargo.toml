[workspace]
resolver = "3"
members = ["crates/xl-engine", "crates/xl-io", "crates/xl-sql", "crates/xl-diff", "crates/xl-history", "crates/xl-app", "crates/xl-bench", "crates/xl-pack", "crates/xl-script"]
exclude = ["vendor"]

[workspace.package]
edition = "2024"
version = "0.4.2"
license = "MIT OR Apache-2.0"
repository = "https://github.com/yeager620/xl"
homepage = "https://github.com/yeager620/xl"

[workspace.dependencies]
xl-engine = { path = "crates/xl-engine" }
xl-io = { path = "crates/xl-io" }
xl-script = { path = "crates/xl-script" }
xl-diff = { path = "crates/xl-diff" }
xl-history = { path = "crates/xl-history" }
xl-sql = { path = "crates/xl-sql" }
rustc-hash = "2"
smallvec = "1"

[profile.release]
lto = "thin"
codegen-units = 1
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2

# Mirror the patches Zed's workspace applies to GPUI's dependency tree
# (vendor/zed/Cargo.toml). Run scripts/fetch-gpui.sh first.
[patch.crates-io]
async-task = { git = "https://github.com/zed-industries/async-task.git", rev = "015845a19fc31752c02367567d3b8900a406f9da" }
calloop = { git = "https://github.com/zed-industries/calloop", rev = "3759371fee14c40066d64777e2a36b6ffcc22590" }
khronos-egl = { git = "https://github.com/zed-industries/khronos-egl", rev = "42214b36347b108fd9630ca6254b96dde59e04fe" }
