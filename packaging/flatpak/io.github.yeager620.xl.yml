# Flatpak manifest. Build with: make flatpak   (see packaging/build-flatpak.sh)
id: io.github.yeager620.xl
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: xl
finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  # No broad filesystem access: open/save go through the file-chooser portal.
build-options:
  append-path: /usr/lib/sdk/rust-stable/bin
  env:
    CARGO_HOME: /run/build/xl/cargo
    CARGO_NET_OFFLINE: 'true'
modules:
  - name: xl
    buildsystem: simple
    build-commands:
      - make install PREFIX=/app
    sources:
      - type: dir
        path: ../..
        skip:
          - target
          - .git
      # Generated from Cargo.lock by build-flatpak.sh (offline crate sources).
      - cargo-sources.json
