[package]
name = "xl-history"
edition.workspace = true
version.workspace = true
license.workspace = true
description = "Local version history of saved workbooks: deduplicated, compressed snapshots with retention"

[dependencies]
flate2 = "=1.1.11"
sha2 = "=0.10.9"
zip = { version = "9", default-features = false, features = ["deflate"] }
